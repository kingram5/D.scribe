<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1A140E;
      width: 400px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #stage {
      width: 400px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .bar {
      fill: #F0A878;
    }
    .murmur-svg {
      filter:
        drop-shadow(0 0 6px rgba(240, 168, 120, 1))
        drop-shadow(0 0 15px rgba(240, 168, 120, 0.85))
        drop-shadow(0 0 35px rgba(193, 122, 71, 0.7))
        drop-shadow(0 0 60px rgba(193, 122, 71, 0.5))
        drop-shadow(0 0 100px rgba(193, 122, 71, 0.3))
        contrast(1.3) saturate(1.2) brightness(1.1);
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script>
    document.fonts.ready.then(() => {
      const stage = document.getElementById('stage');
      const numBars = 80;
      const vw = 310;
      const vh = 290;
      const barWidth = vw / numBars;
      const gap = 1.2;

      let rectsHTML = '';
      // Use a seeded-ish pattern so it looks good statically
      for (let i = 0; i < numBars; i++) {
        const normalizedX = i / numBars;
        const slowWave = Math.sin(normalizedX * Math.PI * 2.2);
        const fastWave = Math.sin(normalizedX * Math.PI * 9) * 0.45;
        const combined = (slowWave + fastWave) / 1.4;
        const scaleY = 0.18 + Math.abs(combined) * 0.75;
        const barH = vh * Math.min(scaleY, 0.95);
        const x = i * barWidth;
        const y = (vh - barH) / 2;
        rectsHTML += `<rect class="bar" x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${(barWidth - gap).toFixed(2)}" height="${barH.toFixed(2)}" />`;
      }

      stage.innerHTML = `
        <svg class="murmur-svg" viewBox="0 0 ${vw} ${vh}" width="390" height="310">
          <defs>
            <clipPath id="dMask">
              <text
                x="50%" y="58%"
                text-anchor="middle"
                dominant-baseline="middle"
                font-family="'Playfair Display', serif"
                font-style="italic"
                font-weight="500"
                font-size="240px"
                letter-spacing="-0.02em">D.</text>
            </clipPath>
          </defs>
          <g clip-path="url(#dMask)">${rectsHTML}</g>
        </svg>
      `;
    });
  </script>
</body>
</html>
